<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Festival Admin Panel</title>
    <link rel="icon" type="image/png" href="images/logo2.png">
    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            min-height: 100vh;
        }

        .admin-wrapper {
            min-height: 100vh;
            padding: 40px 0;
        }

        .admin-card {
            border: 0;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(10px);
        }

        .stat-card {
            border: 0;
            border-radius: 18px;
            transition: .25s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 22px;
        }

        .application-card {
            border: 0;
            border-radius: 18px;
        }

        .status-badge {
            font-size: .78rem;
            padding: .45rem .7rem;
        }

        .application-details {
            font-size: .9rem;
        }

        .application-details i {
            width: 20px;
        }

        #adminPanel {
            display: none;
        }

        #loginSection {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: 0;
            border-radius: 22px;
        }

        .table-responsive {
            border-radius: 15px;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

    </style>

</head>


<body>


<!-- =========================================
     DECORATIVE BACKGROUND
========================================= -->

<div id="stick-bg">

    <img src="images/stick.png"
         class="stick stick-left-1"
         alt="">

    <img src="images/stick.png"
         class="stick stick-left-2"
         alt="">

    <img src="images/stick.png"
         class="stick stick-right-1"
         alt="">

    <img src="images/stick.png"
         class="stick stick-right-2"
         alt="">

</div>


<div id="warli-bg"></div>


<!-- =========================================
     HEADER
========================================= -->

<div id="site-header"></div>


<!-- =========================================
     MAIN
========================================= -->

<div class="container admin-wrapper">


    <!-- =====================================
         LOGIN
    ====================================== -->

    <div id="loginSection">

        <div class=" login-card shadow-lg">

            <div class=" p-4 p-md-5">

                <div class="text-center mb-4">

                    <div class="mb-3">
                        <i class="bi bi-shield-lock-fill fs-1"></i>
                    </div>

                    <h3 class="fw-bold mb-1">
                        Admin Sign In
                    </h3>

                    <p class="text-muted mb-0">
                        Festival Participation Management
                    </p>

                </div>


                <form id="adminLoginForm">

                    <div class="mb-3">

                        <label
                            for="adminEmail"
                            class="form-label fw-semibold">

                            Email

                        </label>

                        <input
                            type="email"
                            id="adminEmail"
                            class="form-control form-control-lg"
                            placeholder="Admin email"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="adminPassword"
                            class="form-label fw-semibold">

                            Password

                        </label>

                        <div class="input-group input-group-lg">

                            <input
                                type="password"
                                id="adminPassword"
                                class="form-control"
                                placeholder="Password"
                                required>

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="togglePassword">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div
                        id="loginAlert"
                        class="alert d-none">
                    </div>


                    <div class="d-grid">

                        <button
                            type="submit"
                            id="loginBtn"
                            class="btn btn-primary btn-lg">

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Sign In

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>



    <!-- =====================================
         ADMIN PANEL
    ====================================== -->

    <div id="adminPanel">


        <!-- =================================
             ADMIN HEADER
        ================================== -->

        <div class="admin-card shadow-lg mb-4 d-none">

            <div class="p-4">

                <div class="d-flex flex-column
                            flex-md-row
                            justify-content-between
                            align-items-md-center
                            gap-3">

                    <div>

                        <div class="d-flex align-items-center gap-2">

                            <i class="bi bi-speedometer2 fs-3"></i>

                            <h2 class="fw-bold mb-0">
                                Admin Dashboard
                            </h2>

                        </div>

                        <div class="text-muted mt-1">

                            <i class="bi bi-person-circle me-1"></i>

                            <span id="adminEmailDisplay"></span>

                        </div>

                    </div>

<!-- 
                    <button
                        type="button"
                        id="logoutBtn"
                        class="btn btn-outline-danger">

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Logout

                    </button> -->

                </div>

            </div>

        </div>



        <!-- =================================
             STATISTICS
        ================================== -->

        <div class="row g-3 mb-4">

             <div class="btn-group" role="group">
            <a type="button" href="add-performer.html" class="btn btn-success">Participate</a>
            <a type="button" href="add-post.html" class="btn btn-primary">Post</a>
            <button type="button" id="logoutBtn" class="btn btn-danger">Logout</button>
           </div>


            <!-- Total -->

            <div class="col-6 col-lg-3">

                <div class="card stat-card shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">
                                    Total Applications
                                </div>

                                <div
                                    id="totalCount"
                                    class="fs-2 fw-bold">
                                    0
                                </div>

                            </div>

                            <div class="stat-icon
                                        bg-primary-subtle
                                        text-primary">

                                <i class="bi bi-people-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Pending -->

            <div class="col-6 col-lg-3">

                <div class="card stat-card shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">
                                    Pending
                                </div>

                                <div
                                    id="pendingCount"
                                    class="fs-2 fw-bold">
                                    0
                                </div>

                            </div>

                            <div class="stat-icon
                                        bg-warning-subtle
                                        text-warning">

                                <i class="bi bi-clock-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Approved -->

            <div class="col-6 col-lg-3">

                <div class="card stat-card shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">
                                    Approved
                                </div>

                                <div
                                    id="approvedCount"
                                    class="fs-2 fw-bold">
                                    0
                                </div>

                            </div>

                            <div class="stat-icon
                                        bg-success-subtle
                                        text-success">

                                <i class="bi bi-check-circle-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Rejected -->

            <div class="col-6 col-lg-3">

                <div class="card stat-card shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">
                                    Rejected
                                </div>

                                <div
                                    id="rejectedCount"
                                    class="fs-2 fw-bold">
                                    0
                                </div>

                            </div>

                            <div class="stat-icon
                                        bg-danger-subtle
                                        text-danger">

                                <i class="bi bi-x-circle-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- =================================
             APPLICATION LIST
        ================================== -->

        <div class="card admin-card shadow-lg">

            <div class="card-body p-3 p-md-4">


                <!-- Toolbar -->

                <div class="row g-2 mb-4">

                    <div class="col-12 col-md-6">

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-search"></i>

                            </span>

                            <input
                                type="search"
                                id="searchInput"
                                class="form-control"
                                placeholder="Search name, mobile or email...">

                        </div>

                    </div>


                    <div class="col-12 col-md-3">

                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="all">
                                All Applications
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                            <option value="approved">
                                Approved
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>

                        </select>

                    </div>


                    <div class="col-12 col-md-3">

                        <button
                            type="button"
                            id="refreshBtn"
                            class="btn btn-outline-primary w-100">

                            <i class="bi bi-arrow-clockwise me-2"></i>

                            Refresh

                        </button>

                    </div>

                </div>



                <!-- Application count -->

                <div class="d-flex
                            justify-content-between
                            align-items-center
                            mb-3">

                    <h5 class="fw-bold mb-0">
                        Applications
                    </h5>

                    <span
                        id="visibleCount"
                        class="badge text-bg-secondary">
                        0
                    </span>

                </div>



                <!-- List -->

                <div id="applicationList"></div>


                <!-- Empty -->

                <div
                    id="emptyState"
                    class="empty-state d-none">

                    <i class="bi bi-inbox fs-1 text-muted"></i>

                    <h5 class="mt-3">
                        No Applications Found
                    </h5>

                    <p class="text-muted mb-0">
                        There are no applications matching your search.
                    </p>

                </div>


            </div>

        </div>

    </div>

</div>



<!-- =========================================
     FOOTER
========================================= -->

<div id="site-footer"></div>


<!-- =========================================
     BOOTSTRAP
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =========================================
     FIREBASE
========================================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js">
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js">
</script>


<!-- =========================================
     FIREBASE CONFIG
========================================= -->

<script src="js/firebase.js"></script>


<!-- =========================================
     ADMIN SCRIPT
========================================= -->

<script >
// ============================================================
// Festival Participation - Admin Panel
// ============================================================

document.addEventListener("DOMContentLoaded", () => {

    // ========================================================
    // ADMIN EMAIL
    // ========================================================

    const ADMIN_EMAIL =
        "team.dooarsmonsoonfestival@gmail.com";


    // ========================================================
    // ELEMENTS
    // ========================================================

    const loginSection =
        document.getElementById("loginSection");

    const adminPanel =
        document.getElementById("adminPanel");

    const loginForm =
        document.getElementById("adminLoginForm");

    const adminEmail =
        document.getElementById("adminEmail");

    const adminPassword =
        document.getElementById("adminPassword");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginAlert =
        document.getElementById("loginAlert");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const togglePassword =
        document.getElementById("togglePassword");

    const adminEmailDisplay =
        document.getElementById("adminEmailDisplay");

    const applicationList =
        document.getElementById("applicationList");

    const emptyState =
        document.getElementById("emptyState");

    const searchInput =
        document.getElementById("searchInput");

    const statusFilter =
        document.getElementById("statusFilter");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const totalCount =
        document.getElementById("totalCount");

    const pendingCount =
        document.getElementById("pendingCount");

    const approvedCount =
        document.getElementById("approvedCount");

    const rejectedCount =
        document.getElementById("rejectedCount");

    const visibleCount =
        document.getElementById("visibleCount");


    // ========================================================
    // DATA
    // ========================================================

    let applications = [];
    // ========================================================
    // LOGIN ALERT
    // ========================================================

    function showLoginAlert(message, type = "danger") {

        loginAlert.className =
            `alert alert-${type}`;

        loginAlert.innerHTML = message;

    }


    function hideLoginAlert() {

        loginAlert.className =
            "alert d-none";

        loginAlert.innerHTML = "";

    }


    // ========================================================
    // PASSWORD TOGGLE
    // ========================================================

    togglePassword.addEventListener("click", () => {

        if (adminPassword.type === "password") {

            adminPassword.type = "text";

            togglePassword.innerHTML =
                `<i class="bi bi-eye-slash"></i>`;

        } else {

            adminPassword.type = "password";

            togglePassword.innerHTML =
                `<i class="bi bi-eye"></i>`;

        }

    });


    // ========================================================
    // LOGIN
    // ========================================================

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        hideLoginAlert();

        const email =
            adminEmail.value.trim().toLowerCase();

        const password =
            adminPassword.value;


        // ----------------------------------------------------
        // ADMIN EMAIL CHECK
        // ----------------------------------------------------

        if (email !== ADMIN_EMAIL) {

            showLoginAlert(
                `
                <i class="bi bi-shield-x me-2"></i>
                This account is not authorized as an administrator.
                `,
                "danger"
            );

            return;
        }


        loginBtn.disabled = true;

        loginBtn.innerHTML = `
            <span class="spinner-border spinner-border-sm me-2"></span>
            Signing In...
        `;


        try {

            await firebase.auth()
                .signInWithEmailAndPassword(
                    email,
                    password
                );


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            let message =
                "Unable to sign in. Please check your email and password.";


            if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Incorrect password.";

            }


            if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "Admin account was not found.";

            }


            if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "Too many attempts. Please try again later.";

            }


            showLoginAlert(
                message,
                "danger"
            );


        } finally {

            loginBtn.disabled = false;

            loginBtn.innerHTML = `
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            `;

        }

    });


    // ========================================================
    // AUTH STATE
    // ========================================================

    firebase.auth().onAuthStateChanged(async (user) => {

        if (!user) {

            loginSection.style.display = "flex";
            adminPanel.style.display = "none";

            return;
        }


        // ----------------------------------------------------
        // VERIFY ADMIN EMAIL
        // ----------------------------------------------------

        if (
            user.email.toLowerCase() !== ADMIN_EMAIL
        ) {

            await firebase.auth().signOut();

            loginSection.style.display = "flex";
            adminPanel.style.display = "none";

            showLoginAlert(
                "You are not authorized to access this page.",
                "danger"
            );

            return;
        }


        // ----------------------------------------------------
        // SHOW ADMIN
        // ----------------------------------------------------

        loginSection.style.display = "none";
        adminPanel.style.display = "block";

        adminEmailDisplay.textContent =
            user.email;


        // ----------------------------------------------------
        // LOAD APPLICATIONS
        // ----------------------------------------------------

        await loadApplications();

    });


    // ========================================================
    // LOAD APPLICATIONS
    // ========================================================

    async function loadApplications() {

        applicationList.innerHTML = `
            <div class="text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status">
                </div>

                <div class="text-muted mt-3">
                    Loading applications...
                </div>

            </div>
        `;


        try {

            const snapshot =
                await db
                    .ref("participations")
                    .once("value");


            applications = [];


            snapshot.forEach(child => {

                const data = child.val();

                if (!data) return;


                applications.push({

                    key: child.key,

                    id: data.id || child.key,

                    name: data.name || "",

                    mobile: data.mobile || child.key,

                    email: data.email || "",

                    participateType:
                        data.participateType || "",

                    address:
                        data.address || "",

                    status:
                        data.status || "pending",

                    createdAt:
                        data.createdAt || 0

                });

            });


            // Newest first

            applications.sort(
                (a, b) =>
                    b.createdAt - a.createdAt
            );


            updateStatistics();

            renderApplications();


        } catch (error) {

            console.error(
                "Load applications error:",
                error
            );


            applicationList.innerHTML = `
                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    Unable to load applications.

                </div>
            `;

        }

    }


    // ========================================================
    // STATISTICS
    // ========================================================

    function updateStatistics() {

        let total = applications.length;

        let pending = 0;

        let approved = 0;

        let rejected = 0;


        applications.forEach(application => {

            if (application.status === "pending") {
                pending++;
            }

            else if (application.status === "approved") {
                approved++;
            }

            else if (application.status === "rejected") {
                rejected++;
            }

        });


        totalCount.textContent =
            total;

        pendingCount.textContent =
            pending;

        approvedCount.textContent =
            approved;

        rejectedCount.textContent =
            rejected;

    }


    // ========================================================
    // RENDER APPLICATIONS
    // ========================================================

    function renderApplications() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();

        const filter =
            statusFilter.value;


        const filtered =
            applications.filter(application => {

                const matchesSearch =
                    !search ||

                    application.name
                        .toLowerCase()
                        .includes(search) ||

                    application.mobile
                        .toLowerCase()
                        .includes(search) ||

                    application.email
                        .toLowerCase()
                        .includes(search);


                const matchesStatus =
                    filter === "all" ||
                    application.status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            });


        visibleCount.textContent =
            filtered.length;


        if (filtered.length === 0) {

            applicationList.innerHTML = "";

            emptyState.classList.remove("d-none");

            return;

        }


        emptyState.classList.add("d-none");


        applicationList.innerHTML =
            filtered
                .map(application =>
                    createApplicationCard(application)
                )
                .join("");

    }


    // ========================================================
    // APPLICATION CARD
    // ========================================================

    function createApplicationCard(application) {

        const status =
            application.status;


        let badgeClass =
            "text-bg-warning";

        let icon =
            "clock-fill";

        let statusText =
            "Pending";


        if (status === "approved") {

            badgeClass =
                "text-bg-success";

            icon =
                "check-circle-fill";

            statusText =
                "Approved";

        }


        if (status === "rejected") {

            badgeClass =
                "text-bg-danger";

            icon =
                "x-circle-fill";

            statusText =
                "Rejected";

        }


        const date =
            application.createdAt
                ? new Date(
                    application.createdAt
                ).toLocaleString(
                    "en-IN",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                )
                : "-";


        const typeText =
            formatParticipationType(
                application.participateType
            );


        return `

            <div
                class="card application-card shadow-sm mb-3">

                <div class="card-body">

                    <!-- TOP -->

                    <div class="d-flex
                                flex-column
                                flex-lg-row
                                justify-content-between
                                gap-3">

                        <div>

                            <div class="d-flex
                                        align-items-center
                                        flex-wrap
                                        gap-2">

                                <h5 class="fw-bold mb-0">

                                    ${escapeHtml(
                                        application.name
                                    )}

                                </h5>

                                <span
                                    class="badge status-badge ${badgeClass}">

                                    <i
                                        class="bi bi-${icon} me-1">
                                    </i>

                                    ${statusText}

                                </span>

                            </div>

                            <div class="text-muted small mt-1">

                                Application ID:
                                <strong>
                                    ${escapeHtml(
                                        application.id
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div class="text-muted small">

                            <i class="bi bi-calendar3 me-1"></i>

                            ${date}

                        </div>

                    </div>


                    <hr>


                    <!-- DETAILS -->

                    <div class="row g-3 application-details">


                        <!-- MOBILE -->

                        <div class="col-12 col-md-6">

                            <i class="bi bi-phone-fill"></i>

                            <strong>Mobile:</strong>

                            ${escapeHtml(
                                application.mobile
                            )}

                        </div>


                        <!-- EMAIL -->

                        <div class="col-12 col-md-6">

                            <i class="bi bi-envelope-fill"></i>

                            <strong>Email:</strong>

                            ${escapeHtml(
                                application.email
                            )}

                        </div>


                        <!-- TYPE -->

                        <div class="col-12 col-md-6">

                            <i class="bi bi-music-note-beamed"></i>

                            <strong>Participation:</strong>

                            ${typeText}

                        </div>


                        <!-- ADDRESS -->

                        <div class="col-12">

                            <i class="bi bi-geo-alt-fill"></i>

                            <strong>Address:</strong>

                            ${escapeHtml(
                                application.address
                            )}

                        </div>

                    </div>


                    <hr>


                    <!-- ACTIONS -->

                    <div class="d-flex
                                flex-column
                                flex-sm-row
                                gap-2">


                        ${
                            status !== "approved"
                            ? `

                                <button
                                    type="button"
                                    class="btn btn-success
                                           flex-fill
                                           approve-btn"
                                    data-mobile="${escapeHtml(
                                        application.mobile
                                    )}">

                                    <i
                                        class="bi bi-check-circle-fill me-2">
                                    </i>

                                    Approve

                                </button>

                            `
                            : ""
                        }


                        ${
                            status !== "rejected"
                            ? `

                                <button
                                    type="button"
                                    class="btn btn-outline-danger
                                           flex-fill
                                           reject-btn"
                                    data-mobile="${escapeHtml(
                                        application.mobile
                                    )}">

                                    <i
                                        class="bi bi-x-circle-fill me-2">
                                    </i>

                                    Reject

                                </button>

                            `
                            : ""
                        }

                    </div>

                </div>

            </div>

        `;

    }


    // ========================================================
    // PARTICIPATION TYPE
    // ========================================================

    function formatParticipationType(type) {

        if (type === "music") {
            return "Music";
        }

        if (type === "hand-craft-stall") {
            return "Hand Craft Stall";
        }

        if (type === "food-stall") {
            return "Food Stall";
        }

        return escapeHtml(type || "-");

    }


    // ========================================================
    // APPROVE / REJECT
    // ========================================================

    applicationList.addEventListener(
        "click",
        async (event) => {

            const approveBtn =
                event.target.closest(
                    ".approve-btn"
                );

            const rejectBtn =
                event.target.closest(
                    ".reject-btn"
                );


            if (approveBtn) {

                await changeStatus(
                    approveBtn.dataset.mobile,
                    "approved"
                );

            }


            if (rejectBtn) {

                await changeStatus(
                    rejectBtn.dataset.mobile,
                    "rejected"
                );

            }

        }
    );


    // ========================================================
    // CHANGE STATUS
    // ========================================================

    async function changeStatus(
        mobile,
        newStatus
    ) {

        const application =
            applications.find(
                item =>
                    item.mobile === mobile
            );


        if (!application) {
            return;
        }


        const actionText =
            newStatus === "approved"
                ? "approve"
                : "reject";


        const confirmed =
            confirm(
                `Are you sure you want to ${actionText} this application?`
            );


        if (!confirmed) {
            return;
        }


        try {

            // ================================================
            // UPDATE BOTH LOCATIONS
            // ================================================

            const updates = {};


            updates[
                `/participations/${mobile}/status`
            ] = newStatus;


            updates[
                `/publicStatus/${mobile}/status`
            ] = newStatus;


            await db.ref().update(updates);


            // ================================================
            // UPDATE LOCAL DATA
            // ================================================

            application.status =
                newStatus;


            updateStatistics();

            renderApplications();


        } catch (error) {

            console.error(
                "Status update error:",
                error
            );


            alert(
                "Unable to update application status."
            );

        }

    }


    // ========================================================
    // SEARCH
    // ========================================================

    searchInput.addEventListener(
        "input",
        renderApplications
    );


    // ========================================================
    // FILTER
    // ========================================================

    statusFilter.addEventListener(
        "change",
        renderApplications
    );


    // ========================================================
    // REFRESH
    // ========================================================

    refreshBtn.addEventListener(
        "click",
        loadApplications
    );


    // ========================================================
    // LOGOUT
    // ========================================================

    logoutBtn.addEventListener(
        "click",
        async () => {

            try {

                await firebase.auth().signOut();

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }

        }
    );


    // ========================================================
    // ESCAPE HTML
    // ========================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

});


</script>
